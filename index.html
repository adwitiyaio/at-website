<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7fbfe" />

    <title>Adwitiya is now Intiqo</title>
    <meta
      name="description"
      content="Adwitiya Technologies has evolved into Intiqo. Visit our new home to see what comes next."
    />
    <meta property="og:title" content="Adwitiya is now Intiqo" />
    <meta
      property="og:description"
      content="Adwitiya Technologies has evolved into Intiqo. Visit our new home to see what comes next."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" href="assets/intiqo-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="site-shell">
      <div class="background-grid" aria-hidden="true"></div>
      <div
        class="background-glow background-glow--one"
        aria-hidden="true"
      ></div>
      <div
        class="background-glow background-glow--two"
        aria-hidden="true"
      ></div>

      <section class="hero" aria-labelledby="rebrand-heading">
        <div class="announcement">
          <span class="announcement-dot" aria-hidden="true"></span>
          A new chapter
        </div>

        <div
          class="brand-transition"
          aria-label="Adwitiya Technologies has become Intiqo"
        >
          <div class="logo-panel logo-panel--old">
            <span class="logo-panel-label">Formerly</span>
            <div class="logo-stage">
              <img
                class="brand-logo brand-logo--adwitiya"
                src="assets/adwitiya-logo.png"
                alt="Adwitiya Technologies"
                width="1700"
                height="625"
              />
            </div>
          </div>

          <div class="transition-mark" aria-hidden="true">
            <div class="transition-track">
              <span class="transition-dot"></span>
              <span class="transition-arrow">→</span>
            </div>
            <span class="transition-caption">New identity</span>
          </div>

          <div class="logo-panel logo-panel--new">
            <span class="logo-panel-label">Now</span>
            <div class="logo-stage">
              <img
                class="brand-logo brand-logo--intiqo"
                src="assets/intiqo-logo.svg"
                alt="Intiqo"
                width="751"
                height="292"
              />
            </div>
          </div>
        </div>

        <div class="hero-copy">
          <h1 id="rebrand-heading">
            Adwitiya is now <span class="gradient-text">Intiqo.</span>
          </h1>
          <p>
            We’ve evolved—with a new name, a new identity, and a renewed focus
            on what comes next. Our story continues at Intiqo.
          </p>

          <a class="primary-link" href="https://www.intiqo.com">
            Continue to Intiqo
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>

          <span class="destination-note">You’ll be taken to intiqo.com</span>
        </div>
      </section>

      <footer>
        <span>Intiqo</span>
        <span class="footer-divider" aria-hidden="true"></span>
        <span>Formerly Adwitiya Technologies</span>
      </footer>
    </main>
  </body>
</html>
