<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfcfd" />

    <title>Adwitiya is now Intiqo</title>
    <meta
      name="description"
      content="Adwitiya Technologies has evolved into Intiqo. Visit our new home to see what comes next."
    />
    <meta property="og:title" content="Adwitiya is now Intiqo" />
    <meta
      property="og:description"
      content="Adwitiya Technologies has evolved into Intiqo. Visit our new home to see what comes next."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.intiqo.com" />

    <link rel="icon" href="assets/intiqo-logo.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="hero" aria-labelledby="rebrand-heading">
        <p class="eyebrow">A new chapter</p>

        <div
          class="lockup"
          role="img"
          aria-label="Adwitiya Technologies has become Intiqo"
        >
          <img
            class="lockup-logo lockup-logo--past"
            src="assets/adwitiya-logo.png"
            alt=""
            width="1700"
            height="625"
          />

          <svg
            class="lockup-arrow"
            viewBox="0 0 48 8"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M0 4h45M41.5 1 45 4l-3.5 3"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <img
            class="lockup-logo lockup-logo--now"
            src="assets/intiqo-logo.svg"
            alt=""
            width="751"
            height="292"
          />
        </div>

        <h1 id="rebrand-heading">
          Adwitiya is now <span class="accent">Intiqo.</span>
        </h1>

        <p class="lede">
          We’ve evolved—with a new name, a new identity, and a renewed focus on
          what comes next. Our story continues at Intiqo.
        </p>

        <a class="cta" href="https://www.intiqo.com">
          Continue to Intiqo
          <svg
            class="cta-arrow"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 12 12 4M5.5 4H12v6.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </section>

      <footer class="footer">
        <p class="footer-contact">
          Questions about the transition?
          <a href="mailto:connect@adwitiya.io">connect@adwitiya.io</a>
        </p>
        <p class="footer-legal">
          © <span id="year">2026</span> Intiqo. All rights reserved.
        </p>
      </footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
